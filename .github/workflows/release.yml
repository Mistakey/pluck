name: Release Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, e.g. 0.3.0 (must match the selected commit)'
        required: true
        type: string
      notes:
        description: 'Release notes shown in the application'
        required: true
        type: string
      verify_installation:
        description: 'Verify portable migration and publish/update the signed candidate on an isolated hosted Windows runner'
        type: boolean
        default: false
      build_run:
        description: 'Successful candidate build run ID (required for installation verification)'
        type: string
      diagnose_only:
        description: 'Only diagnose the installed 0.2.0 application; do not build portable or publish a candidate'
        type: boolean
        default: false
      portable_run:
        description: 'Reuse the fixed legacy binary from a previous successful portable-build step (optional)'
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.verify_installation }}
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES_FILE: .forge/tmp/release-notes.md
      UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate version, notes and channel
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          New-Item -ItemType Directory -Force .forge/tmp | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD $env:RELEASE_NOTES_FILE), $env:RELEASE_NOTES, [Text.UTF8Encoding]::new($false))
          node scripts/release.mjs prepare
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rust
      - run: pnpm verify:ui
      - run: pnpm verify:updates
      - run: pnpm test:release
      - name: Build current-user installer and signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY' }
          pnpm tauri build --bundles nsis --config .forge/tmp/release/tauri.conf.json --ci
      - run: node scripts/release.mjs metadata
      - name: Verify artifact with the runtime updater
        run: cargo run --example verify_update --manifest-path src-tauri/Cargo.toml -- .forge/tmp/release/artifacts/latest.json ".forge/tmp/release/artifacts/Pluck_$($env:RELEASE_VERSION)_x64-setup.exe"
      - name: Upload draft, verify all assets, then publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
      - name: Retain signed candidate for actual installation verification
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ inputs.version }}
          path: .forge/tmp/release/artifacts/*
          retention-days: 30
      - name: Record expected installed binary
        if: github.ref != 'refs/heads/main'
        run: |
          (Get-FileHash src-tauri/target/release/pluck.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content .forge/tmp/release/binary.sha256
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: installed-binary-${{ inputs.version }}
          path: .forge/tmp/release/binary.sha256
          retention-days: 30

  installation:
    if: inputs.verify_installation
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_RUN: ${{ inputs.build_run }}
      DIAGNOSE_ONLY: ${{ inputs.diagnose_only }}
      LEGACY_BUILD_RUN: ${{ inputs.portable_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@v4
        if: ${{ !inputs.diagnose_only && !inputs.portable_run }}
        with:
          ref: d6cca12db0d9b479297dbc269ac0c4c0dc0f99d1
          path: .forge/tmp/portable-source
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.diagnose_only && !inputs.portable_run }}
      - name: Build the existing portable version without changing its source
        if: ${{ !inputs.diagnose_only && !inputs.portable_run }}
        working-directory: .forge/tmp/portable-source
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle --ci
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.diagnose_only && !inputs.portable_run }}
        with:
          name: legacy-portable-d6cca12
          path: .forge/tmp/portable-source/src-tauri/target/release/pluck.exe
          retention-days: 30
      - name: Migrate, exercise failed draft, publish candidate, and update through the installed UI
        run: node scripts/verify-installation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-evidence-${{ inputs.version }}
          path: .forge/tmp/installation/evidence/*
          retention-days: 90
